services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: starlite-api
    ports:
      - "8000:8000"
    volumes:
      - starlite-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: starlite-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  starlite-data:
